{% extends "base.html" %}
{% block title %}Verdant · Calendar View{% endblock %}
{% block content %}
<section id="panel-calendar" class="space-y-6">
      <header>
        <h2 class="font-display text-2xl font-semibold text-navy-800">Garden Calendar</h2>
        <p class="text-sm text-navy-500">Select a day to view its observations.</p>
      </header>
      <p id="calendar-empty" class="hidden card text-center text-navy-500">No observations yet — add one in Garden Logs to populate the calendar.</p>
      <div id="calendar-grid" class="grid gap-6 xl:grid-cols-3"></div>
    </section>
{% endblock %}
{% block overlays %}
<div id="day-modal" class="hidden" aria-hidden="true"></div>


<div id="lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-navy-900/90 p-4">
  <img id="lightbox-img" alt="" class="max-h-full max-w-full rounded-xl shadow-botanical" />
</div>
{% endblock %}
