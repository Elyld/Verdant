<!DOCTYPE html>
<html lang="en" class="h-full" data-version="{{ __version__ }}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verdant · Calendar View</title>
<meta name="description" content="Self-hosted gardening blog and observation log." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          sage: { 50: '#f2f6f1', 100: '#e2ebdf', 200: '#c6d8c1', 300: '#a4c09d', 400: '#82a87b', 500: '#688d61', 600: '#51704c', 700: '#41593d', 800: '#334631', 900: '#233022' },
          navy: { 50: '#eef2f7', 100: '#d6e0ec', 200: '#adc0d7', 300: '#7d97b9', 400: '#4f6d94', 500: '#2f4f75', 600: '#233d5c', 700: '#1b3049', 800: '#142337', 900: '#0d1725' },
          beige: { 50: '#fdfbf6', 100: '#f8f2e6', 200: '#efe4cd', 300: '#e3d3b0', 400: '#d3bd8d', 500: '#c0a469', 600: '#a4884f', 700: '#816b3e', 800: '#5d4d2d', 900: '#3a301c' }
        },
        fontFamily: {
          display: ['Georgia', 'Cambria', 'Times New Roman', 'serif'],
          body: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif']
        },
        boxShadow: { botanical: '0 10px 30px -12px rgba(20,35,55,0.35)' }
      }
    }
  };
</script>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="h-full font-body bg-beige-100 text-navy-800 antialiased">
<div class="leaf-bg min-h-full">

  <!-- Header -->
  <header class="bg-navy-800 text-beige-100 shadow-botanical">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col gap-4 py-5 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-3">
          <span class="grid h-11 w-11 place-items-center rounded-xl bg-sage-400/20 text-2xl ring-1 ring-sage-300/40">🌿</span>
          <div>
            <h1 class="font-display text-2xl font-semibold tracking-tight text-beige-50">Verdant</h1>
            <p class="text-xs uppercase tracking-[0.18em] text-sage-200">Garden Journal &amp; Observation Log</p>
          </div>
        </div>
        <nav class="flex rounded-xl bg-navy-900/60 p-1 ring-1 ring-navy-600/60" role="tablist" aria-label="Sections">
          <a href="/" class="tab-btn flex-1 rounded-lg px-4 py-2 text-sm font-semibold transition sm:flex-none">Blog &amp; Stories</a>
          <a href="/observations" class="tab-btn flex-1 rounded-lg px-4 py-2 text-sm font-semibold transition sm:flex-none">Garden Logs</a>
          <a href="/calendar" class="tab-btn flex-1 rounded-lg px-4 py-2 text-sm font-semibold transition sm:flex-none">Calendar</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <!-- Calendar tab content -->
    <section id="panel-calendar" data-panel="calendar" class="hidden space-y-10">
      <!-- Calendar -->
      <div class="grid gap-2 lg:grid-cols-[minmax(0,4rem)_minmax(0,1fr)]" id="calendar-grid">
        <!-- populated by app.js -->
        <p class="text-sage-500 text-center">No observations yet — log some observations to populate the calendar.</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-beige-300 bg-beige-50/70 py-6 text-center text-xs text-navy-400">
    Verdant · self-hosted garden journal ·
    <a class="underline decoration-sage-400 hover:text-navy-700" href="/docs">API docs</a>
    <span id="app-version" class="pill" title="Verdant version"></span>
  </footer>
</div>

<!-- Lightbox -->
<div id="lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-navy-900/90 p-4">
  <img id="lightbox-img" alt="" class="max-h-full max-w-full rounded-xl shadow-botanical" />
</div>

<!-- Toasts -->
<div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-80 flex-col gap-2"></div>

<script src="/static/app.js"></script>
</body>
</html>
