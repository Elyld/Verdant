{% extends "base.html" %}
{% block title %}Verdant · Costs{% endblock %}
{% block content %}
<section id="panel-costs" class="space-y-6">
      <header>
        <h2 class="font-display text-2xl font-semibold text-navy-800">Costs</h2>
        <p class="text-sm text-navy-500">What the garden costs — seeds, soil, fertilizer, all of it.</p>
      </header>

      <div class="grid gap-4 sm:grid-cols-3">
        <div class="card">
          <p class="text-xs uppercase tracking-widest text-navy-400">Total spent</p>
          <p id="costs-total" class="font-display text-3xl font-semibold text-navy-800">$0.00</p>
        </div>
        <div class="card sm:col-span-2">
          <p class="text-xs uppercase tracking-widest text-navy-400">By category</p>
          <div id="costs-by-cat" class="mt-2 flex flex-wrap gap-2"></div>
        </div>
      </div>

      <form id="cost-form" class="card space-y-3">
        <h3 class="font-display text-lg font-semibold text-navy-800">Log a purchase</h3>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
          <label class="block"><span class="lbl">Date</span><input id="cost-date" type="date" class="inp" required /></label>
          <label class="block"><span class="lbl">Category</span>
            <select id="cost-category" class="inp">
              <option>Seeds</option><option>Soil</option><option>Fertilizer</option>
              <option>Tools</option><option>Plants</option><option selected>Supplies</option><option>Other</option>
            </select>
          </label>
          <label class="block"><span class="lbl">What</span><input id="cost-desc" type="text" class="inp" placeholder="Bag of potting mix" maxlength="200" /></label>
          <label class="block"><span class="lbl">Amount ($)</span><input id="cost-amount" type="number" min="0" step="0.01" class="inp" placeholder="0.00" required /></label>
          <label class="block"><span class="lbl">Notes</span><input id="cost-notes" type="text" class="inp" placeholder="optional" /></label>
        </div>
        <button type="submit" class="btn-primary">Add expense</button>
      </form>

      <div class="card overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-xs uppercase tracking-widest text-navy-400">
            <th class="py-2 pr-3">Date</th><th class="py-2 pr-3">Category</th><th class="py-2 pr-3">What</th>
            <th class="py-2 pr-3 text-right">Amount</th><th class="py-2"></th>
          </tr></thead>
          <tbody id="costs-rows"></tbody>
        </table>
        <p id="costs-empty" class="py-4 text-center text-sm text-navy-400">No expenses yet.</p>
      </div>
    </section>
{% endblock %}
