{% extends "base.html" %}
{% block title %}Verdant · Pests{% endblock %}
{% block content %}
<section id="panel-pests" class="space-y-6">
      <header>
        <h2 class="font-display text-2xl font-semibold text-navy-800">Pests</h2>
        <p class="text-sm text-navy-500">What showed up, what you did about it, whether it worked.</p>
      </header>

      <form id="pest-form" class="card space-y-3">
        <h3 class="font-display text-lg font-semibold text-navy-800">Log a sighting</h3>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
          <label class="block"><span class="lbl">Date</span><input id="pest-date" type="date" class="inp" required /></label>
          <label class="block"><span class="lbl">Pest</span><input id="pest-name" type="text" class="inp" placeholder="Aphids" maxlength="120" required /></label>
          <label class="block"><span class="lbl">Plant (optional)</span><select id="pest-plant" class="inp"><option value="">—</option></select></label>
          <label class="block"><span class="lbl">Treatment</span><input id="pest-treatment" type="text" class="inp" placeholder="Neem oil spray" /></label>
          <label class="block"><span class="lbl">Notes</span><input id="pest-notes" type="text" class="inp" placeholder="optional" /></label>
        </div>
        <button type="submit" class="btn-primary">Log it</button>
      </form>

      <div class="grid gap-6 lg:grid-cols-2">
        <section class="card">
          <h3 class="font-display text-lg font-semibold text-navy-800">Active</h3>
          <ul id="pests-open" class="mt-3 space-y-3"></ul>
          <p id="pests-open-empty" class="py-3 text-center text-sm text-navy-400">No active pest issues. Knock on wood.</p>
        </section>
        <section class="card">
          <h3 class="font-display text-lg font-semibold text-navy-800">Resolved</h3>
          <ul id="pests-done" class="mt-3 space-y-3"></ul>
          <p id="pests-done-empty" class="py-3 text-center text-sm text-navy-400">Nothing resolved yet.</p>
        </section>
      </div>
    </section>
{% endblock %}
