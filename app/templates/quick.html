{% extends "base.html" %}
{% block title %}Verdant · Quick Log{% endblock %}
{% block main %}
<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">
{% block content %}
<section id="panel-quick" class="space-y-6">
      <header class="flex flex-wrap items-baseline justify-between gap-2">
        <div>
          <h2 class="font-display text-2xl font-semibold text-navy-800">Quick Log</h2>
          <p class="text-sm text-navy-500">Big buttons, no typing. Made for dirty hands.</p>
        </div>
        <p id="quick-today" class="pill"></p>
      </header>

      <div id="quick-groups" class="space-y-6"></div>

      <section class="card">
        <h3 class="font-display text-lg font-semibold text-navy-800">Logged today</h3>
        <ul id="quick-today-log" class="mt-2 space-y-1 text-sm text-navy-600">
          <li class="text-navy-400">Nothing yet — go touch grass.</li>
        </ul>
      </section>
    </section>
{% endblock %}
</main>
{% endblock %}
