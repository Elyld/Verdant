# Enables GitHub's native auto-merge on pull requests targeting main.
# The PR merges (merge commit, matching existing history) automatically
# once all checks pass. No third-party actions — just the gh CLI.
#
# Note: for auto-merge to wait on CI, mark the "Tests" and
# "Publish Docker image" checks as required in the branch protection
# settings for main (repo Settings > Branches). Without required checks,
# GitHub merges as soon as auto-merge is enabled.

name: Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
